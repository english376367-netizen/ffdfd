<title>Volunteering Vocabulary Practice</title>
<style>
:root{--blue:#2878d0;--navy:#17345d;--pale:#eef7ff;--green:#16834a;--red:#c43b45}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e4f5ff,#f8edff);color:var(--navy)}
header{padding:22px 14px;text-align:center;background:linear-gradient(110deg,#1676c8,#7548b8);color:white}
h1{margin:0;font-size:clamp(22px,4vw,34px)}header p{margin:8px 0 0}
main{max-width:1050px;margin:18px auto;padding:0 12px 30px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
.tab{background:#dcecff;color:#17416f}.tab.active{background:#225fb4;color:#fff}
.panel{background:white;border-radius:20px;padding:18px;box-shadow:0 8px 25px #315b8420}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:10px;background:#e8eef6;border-radius:20px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:#28a66a;width:0;transition:.2s}
h2{margin:5px 0 12px;font-size:22px}.prompt{font-size:clamp(20px,3vw,26px);font-weight:800;text-align:center;margin:12px 0 18px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.choice{background:#f7fbff;border:2px solid #d6e7fa;border-radius:16px;padding:9px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.choice img,.single-img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:10px}
.choice .meaning{font-weight:700;text-align:center;color:#4c376e;min-height:42px;display:flex;align-items:center;justify-content:center}
.choice button{width:100%;background:#e6f1ff;color:#17416f}
.choice button:disabled{opacity:.78;cursor:default}
.choice.correct{border-color:#24a35a;background:#effbf3}.choice.wrong{border-color:#d84b56;background:#fff2f2}
.feedback{text-align:center;font-weight:800;font-size:18px;min-height:28px;margin:12px 0}
.good{color:var(--green)}.bad{color:var(--red)}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.primary{background:#2366bb;color:white}.secondary{background:#e8eef6;color:#254365}
.primary:disabled{opacity:.5;cursor:not-allowed}
.type-area{max-width:580px;margin:auto;text-align:center}
.type-area img{height:230px;max-width:100%;object-fit:contain;background:#fff;border-radius:14px}
.meaning-large{font-size:22px;font-weight:800;color:#623c91;margin:12px 0}
input{width:min(100%,460px);padding:14px;border:2px solid #bfd4ed;border-radius:12px;font-size:19px;text-align:center}
input:disabled{background:#f2f4f7;color:#667}
.score{font-weight:800;background:#fff4d8;border-radius:10px;padding:8px 12px}
.small{color:#64748b;font-size:14px;text-align:center}
@media(max-width:650px){.grid{grid-template-columns:1fr}.choice{flex-direction:row;align-items:center}.choice img{width:42%;height:120px}.choice .meaning{flex:1}.choice button{width:auto}.panel{padding:13px}.choice{gap:8px}}
</style></head><body>

let mode=1, order=[], pos=0, score=0, locked=false, answered=0, currentOptions=[];
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(t){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.88;speechSynthesis.speak(u)}
function start(m){mode=m;order=shuffle(words.map((_,i)=>i));pos=0;score=0;answered=0;locked=false;$('score').textContent=`Score: 0 / ${words.length}`;$('bar').style.width='0%';$('exTitle').textContent=m===1?'Exercise 1: Choose the correct picture.':'Exercise 2: Type the English word.';render()}
function switchMode(m){$('tab1').classList.toggle('active',m===1);$('tab2').classList.toggle('active',m===2);start(m)}
function update(){ $('score').textContent=`Score: ${score} / ${words.length}`;$('bar').style.width=(answered/words.length*100)+'%'}
function render(){
 if(pos>=order.length){$('content').innerHTML=`<div class="prompt">Practice complete!</div><div class="feedback good">Your score: ${score} / ${words.length}</div><p class="small">Well done! You have finished this exercise.</p><div class="actions"><button class="primary" onclick="start(mode)">Try again</button></div>`;return}
 locked=false;let w=words[order[pos]];
 if(mode===1){
  let opts=shuffle([order[pos],...shuffle(words.map((_,i)=>i).filter(i=>i!==order[pos])).slice(0,2)]);
  currentOptions=opts;
  $('content').innerHTML=`<div class="small">Question ${pos+1} of ${order.length}</div><div class="prompt">Choose the picture for: <span>${w.en}</span></div><div class="grid">${opts.map((idx,k)=>`<div class="choice" id="opt${k}"><img src="${words[idx].img}" alt="Picture ${k+1}" onclick="speak('${words[idx].en.replace(/'/g,"\\'")}')"><div class="meaning">${words[idx].vi}</div><button onclick="choose(${k})">Choose</button></div>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="primary" id="next" disabled onclick="next()">Next</button></div>`;
 }else{
  $('content').innerHTML=`<div class="small">Question ${pos+1} of ${order.length}</div><div class="type-area"><img class="single-img" src="${w.img}" alt="Vocabulary picture" onclick="speak('${w.en.replace(/'/g,"\\'")}')"><div class="meaning-large">${w.vi}</div><input id="answer" type="text" autocomplete="off" placeholder="Type the English word"><div class="feedback" id="feedback"></div><div class="actions"><button class="primary" id="check" onclick="checkTyped()">Submit</button><button class="secondary" id="skip" onclick="skip()">Skip</button><button class="primary" id="next" style="display:none" onclick="next()">Next</button></div></div>`;
  $('answer').addEventListener('keydown',e=>{if(e.key==='Enter')checkTyped()});
 }
}
function choose(k){
 if(locked)return;locked=true;answered++;let correct=currentOptions[k]===order[pos];
 if(correct){score++;$('opt'+k).classList.add('correct');$('feedback').textContent='Correct!';$('feedback').className='feedback good'}
 else{$('opt'+k).classList.add('wrong');let right=currentOptions.indexOf(order[pos]);$('opt'+right).classList.add('correct');$('feedback').textContent='Incorrect. The correct picture is highlighted.';$('feedback').className='feedback bad'}
 document.querySelectorAll('.choice button').forEach(b=>b.disabled=true);$('next').disabled=false;update();
}
function checkTyped(){
 if(locked)return;let w=words[order[pos]], val=$('answer').value.trim();if(!val){$('feedback').textContent='Please type an answer or choose Skip.';$('feedback').className='feedback bad';return}
 locked=true;answered++;$('answer').disabled=true;$('check').disabled=true;$('skip').disabled=true;
 if(val.toLowerCase()===w.en.toLowerCase()){score++;$('feedback').textContent='Correct!';$('feedback').className='feedback good'}
 else{$('feedback').textContent=`Incorrect. Correct answer: ${w.en}`;$('feedback').className='feedback bad'}
 $('next').style.display='inline-block';update();
}
function skip(){
 if(locked)return;locked=true;answered++;$('answer').disabled=true;$('check').disabled=true;$('skip').disabled=true;
 $('feedback').textContent=`Skipped. Correct answer: ${words[order[pos]].en}`;$('feedback').className='feedback bad';$('next').style.display='inline-block';update();
}
function next(){pos++;render()}
start(1);
</script></body></html>
